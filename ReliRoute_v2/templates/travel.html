<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅行時間查詢 - ReliRoute</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
    rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>

  <aside class="sidebar">
    <a href="{{ url_for('index') }}" class="sidebar-brand">
      <i class="bi bi-signpost-split"></i>
      <span>ReliRoute</span>
    </a>
    <div class="sidebar-subtitle">旅行時間可靠度分析平台</div>

    <nav class="sidebar-nav">
      <a class="nav-link" href="{{ url_for('analysis') }}">
        <i class="bi bi-bar-chart-line"></i> 穩定度分析
      </a>
      <a class="nav-link active" href="{{ url_for('travel') }}">
        <i class="bi bi-clock-history"></i> 旅行時間查詢
      </a>
      <a class="nav-link" href="{{ url_for('about') }}">
        <i class="bi bi-info-circle"></i> 關於平台
      </a>
    </nav>

    <div class="sidebar-footer">&copy; 2026 ReliRoute</div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>旅行時間查詢</h1>
      <p>選擇起訖點與出發時間,查詢預估旅行時間</p>
    </div>

    <div class="workspace-row">

      <!-- 左側 Search Panel : 25% -->
      <div class="panel-filter">
        <div class="card-surface panel-card">
          <h2>查詢條件</h2>

          <div class="mb-3">
            <label class="form-label" for="modeSelect">查詢模式</label>
            <select id="modeSelect" class="form-select">
              <option value="date">指定日期</option>
              <option value="weekday">星期模式</option>
              <option value="holiday">連假分析</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="startSelect">起點</label>
            <select id="startSelect" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="endSelect">終點</label>
            <select id="endSelect" class="form-select"></select>
          </div>

          <div class="mb-3" id="dateGroup">
            <label class="form-label" for="dateInput">日期</label>
            <input type="date" id="dateInput" class="form-control" />
          </div>

          <div class="mb-3 d-none" id="weekdayGroup">
            <label class="form-label" for="weekdaySelect">星期</label>
            <select id="weekdaySelect" class="form-select">
              <option value="Monday">星期一</option>
              <option value="Tuesday">星期二</option>
              <option value="Wednesday">星期三</option>
              <option value="Thursday">星期四</option>
              <option value="Friday">星期五</option>
              <option value="Saturday">星期六</option>
              <option value="Sunday">星期日</option>
            </select>
          </div>

          <div class="d-none" id="holidayGroup">
            <div class="mb-3">
              <label class="form-label" for="holidaySelect">連假名稱</label>
              <select id="holidaySelect" class="form-select">
                <option value="春節連假">春節連假</option>
                <option value="和平紀念日">和平紀念日</option>
                <option value="清明連假">清明連假</option>
                <option value="端午連假">端午連假</option>
                <option value="中秋連假">中秋連假</option>
                <option value="國慶連假">國慶連假</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="rangeSelect">連假區間</label>
              <select id="rangeSelect" class="form-select">
                <option value="前2天">前2天</option>
                <option value="前1天">前1天</option>
                <option value="連假第1天">連假第1天</option>
                <option value="連假最後1天">連假最後1天</option>
                <option value="後1天">後1天</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="timeInput">時間</label>
            <input type="time" id="timeInput" class="form-control" />
          </div>

          <button id="searchBtn" class="btn btn-primary w-100">
            <i class="bi bi-search me-1"></i> 開始查詢
          </button>
        </div>
      </div>

      <!-- 中間 Leaflet Map : 55% -->
      <div class="panel-map">
        <div class="card-surface" style="padding: 12px;">
          <div id="travelMap" class="map-container"></div>
        </div>
      </div>

      <!-- 右側 Travel Time Panel : 20% -->
      <div class="panel-info">
        <div class="card-surface panel-card">
          <h2>總旅行時間</h2>

          <div id="totalTimePlaceholder" class="info-placeholder">
            <i class="bi bi-signpost-2 d-block mb-2" style="font-size: 1.6rem;"></i>
            尚未查詢
          </div>

          <div id="totalTimeContent" class="d-none text-center">
            <div class="total-time-label">總旅行時間</div>
            <div class="total-time-value"><span id="totalTimeValue">0</span> 分鐘</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/travel.js') }}"></script>
</body>

</html>
