<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>穩定度分析 - ReliRoute</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <aside class="sidebar">
    <a href="{{ url_for('index') }}" class="sidebar-brand">
      <i class="bi bi-signpost-split"></i>
      <span>ReliRoute</span>
    </a>
    <div class="sidebar-subtitle">旅行時間可靠度分析平台</div>

    <nav class="sidebar-nav">
      <a class="nav-link active" href="{{ url_for('analysis') }}">
        <i class="bi bi-bar-chart-line"></i> 穩定度分析
      </a>
      <a class="nav-link" href="{{ url_for('travel') }}">
        <i class="bi bi-clock-history"></i> 旅行時間查詢
      </a>
      <a class="nav-link" href="{{ url_for('about') }}">
        <i class="bi bi-info-circle"></i> 關於平台
      </a>
    </nav>

    <div class="sidebar-footer">&copy; 2026 ReliRoute</div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>穩定度分析</h1>
      <p>依時段、日別或綜合條件,檢視國道路段旅行時間穩定度</p>
    </div>

    <div class="workspace-row">

      <!-- 左側 Filter Panel : 25% -->
      <div class="panel-filter">
        <div class="card-surface panel-card">
          <h2>穩定度分析</h2>

          <div class="mb-3">
            <label class="form-label" for="summaryLevelSelect">彙總層級</label>
            <select id="summaryLevelSelect" class="form-select">
              <option value="L4_OVERALL" selected>總覽(不分日別時段)</option>
              <option value="L1_DAY_TYPE">依日別</option>
              <option value="L2_TIME_PERIOD">依時段</option>
              <option value="L3_DAY_TYPE_TIME_PERIOD">依日別+時段</option>
            </select>
          </div>

          <div class="mb-3 d-none" id="timePeriodGroup">
            <label class="form-label" for="timePeriodSelect">時段</label>
            <select id="timePeriodSelect" class="form-select">
              <option value="凌晨">凌晨(00:00–05:59)</option>
              <option value="早尖峰">早尖峰(06:00–08:59)</option>
              <option value="日間">日間(09:00–15:59)</option>
              <option value="晚尖峰">晚尖峰(16:00–18:59)</option>
              <option value="夜間">夜間(19:00–23:59)</option>
            </select>
          </div>

          <div class="mb-3 d-none" id="dayTypeGroup">
            <label class="form-label" for="dayTypeSelect">日別</label>
            <select id="dayTypeSelect" class="form-select">
              <option value="Weekday">平日</option>
              <option value="Weekend">假日</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label" for="directionSelect">方向</label>
            <select id="directionSelect" class="form-select">
              <option value="South" selected>南向</option>
              <option value="North">北向</option>
            </select>
          </div>

          <button id="updateMapBtn" class="btn btn-primary w-100">
            <i class="bi bi-arrow-repeat me-1"></i> 更新地圖
          </button>
        </div>
      </div>

      <!-- 中間 Leaflet Map : 55% -->
      <div class="panel-map">
        <div class="card-surface" style="padding: 12px;">
          <div id="analysisMap" class="map-container"></div>
        </div>
      </div>

      <!-- 右側 Route Info Panel : 20% -->
      <div class="panel-info">
        <div class="card-surface panel-card">
          <h2>路段資訊</h2>

          <div id="routeInfoPlaceholder" class="info-placeholder">
            <i class="bi bi-cursor d-block mb-2" style="font-size: 1.6rem;"></i>
            點擊地圖上的紅黃綠路段
          </div>

          <div id="routeInfoContent" class="d-none">
            <div class="info-route-name" id="infoRouteName"></div>
            <div class="info-id" id="infoPairId"></div>
            <div class="info-row">
              <span class="label">中位數旅行時間</span>
              <span class="value" id="infoMedian"></span>
            </div>
            <div class="info-row">
              <span class="label">P95 旅行時間</span>
              <span class="value" id="infoP95"></span>
            </div>
            <div class="info-row">
              <span class="label">緩衝時間</span>
              <span class="value" id="infoBuffer"></span>
            </div>
            <div class="info-row">
              <span class="label">穩定度等級</span>
              <span class="value"><span id="infoRiskBadge" class="badge-risk"></span></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
</body>
</html>
